services:
  nginx:
    image: nginx:1.27-alpine
    container_name: etms_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/html/public:ro
      - etms_public_storage:/var/www/html/storage/app/public:ro
      - etms_storage:/srv/etms/storage:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - etms_prod_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: etms-app:prod
    container_name: etms_prod_app
    restart: always
    env_file:
      - .env.production
    volumes:
      - etms_public_storage:/var/www/html/storage/app/public
      - etms_storage:/srv/etms/storage
      - etms_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etms_prod_network
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue:
    image: etms-app:prod
    container_name: etms_prod_queue
    restart: always
    user: "www-data"
    env_file:
      - .env.production
    command: php artisan queue:work redis --queue=webhooks,videos,pdfs,notifications,default --sleep=3 --tries=3 --timeout=1800 --max-time=3600
    volumes:
      - etms_public_storage:/var/www/html/storage/app/public
      - etms_storage:/srv/etms/storage
      - etms_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etms_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    image: etms-app:prod
    container_name: etms_prod_scheduler
    restart: always
    user: "www-data"
    env_file:
      - .env.production
    command: php artisan schedule:work
    volumes:
      - etms_public_storage:/var/www/html/storage/app/public
      - etms_storage:/srv/etms/storage
      - etms_logs:/var/www/html/storage/logs
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etms_prod_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.4
    container_name: etms_prod_mysql
    restart: always
    env_file:
      - .env.production
    command: --default-time-zone=+00:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-etms}
      MYSQL_USER: ${DB_USERNAME:-etms}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - etms_mysql_data:/var/lib/mysql
    networks:
      - etms_prod_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: etms_prod_redis
    restart: always
    env_file:
      - .env.production
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    volumes:
      - etms_redis_data:/data
    networks:
      - etms_prod_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  etms_mysql_data:
    driver: local
  etms_redis_data:
    driver: local
  etms_storage:
    driver: local
  etms_public_storage:
    driver: local
  etms_logs:
    driver: local

networks:
  etms_prod_network:
    driver: bridge
