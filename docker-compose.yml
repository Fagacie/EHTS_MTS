services:
  nginx:
    image: nginx:1.27-alpine
    container_name: etms_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - app_storage:/var/www/html/storage/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - etms_network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: etms-app:latest
    container_name: etms_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etms_network
    healthcheck:
      test: [ "CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  queue:
    image: etms-app:latest
    container_name: etms_queue
    restart: unless-stopped
    user: "www-data"
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=webhooks,videos,pdfs,notifications,default --sleep=3 --tries=3 --timeout=1800 --max-time=3600
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etms_network
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'queue:work' > /dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  scheduler:
    image: etms-app:latest
    container_name: etms_scheduler
    restart: unless-stopped
    user: "www-data"
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etms_network
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  mysql:
    image: mysql:8.4
    container_name: etms_mysql
    restart: unless-stopped
    command: --default-time-zone=+00:00 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-etms_root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-etms}
      MYSQL_USER: ${DB_USERNAME:-etms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-etms_secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - etms_network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: etms_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - etms_network
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  node:
    image: node:22-alpine
    container_name: etms_node
    profiles: [ "build" ]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run build"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

networks:
  etms_network:
    driver: bridge
